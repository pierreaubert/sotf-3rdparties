[package]
name = "sotf-tract-nnef-cli"
version = "0.21.8-pre"
authors = [
	"Mathieu Poumeyrol <kali@zoy.org>",
	"Hubert de La Jonquière <hubert.delajonquiere@sonos.com>"
]
license = "MIT OR Apache-2.0"
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
keywords = [ "NeuralNetworks", "NNEF" ]
categories = [ "science" ]
autobenches = false
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
structopt.workspace = true
tract-nnef.workspace = true
tract-pulse.workspace = true
tract-onnx-opl.workspace = true

[[bin]]
name = "tract-nnef-cli"
path = "src/main.rs"

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
