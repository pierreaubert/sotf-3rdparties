[package]
name = "sotf-tract-proxy"
version = "0.22.4"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Poumeyrol <kali@zoy.org>"]
description = "Tiny, no-nonsense, self contained, TensorFlow and ONNX inference"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
keywords = [ "NeuralNetworks" ]
categories = [ "science" ]
autobenches = false
edition = "2024"
rust-version = "1.85"
include = [ "Cargo.toml", "src/**/*.rs", "LICENSE*" ]

[lib]
name = "tract_proxy"

[dependencies]
anyhow.workspace = true
boow.workspace = true
home.workspace = true
ndarray.workspace = true
tract-api.workspace = true
tract-proxy-sys.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
