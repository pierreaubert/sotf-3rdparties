[package]
name = "sotf-block"
version = "0.1.6"
authors = ["Steven Sheldon"]
edition = "2015"

description = "Rust interface for Apple's C language extension of blocks."
keywords = ["blocks", "osx", "ios", "objective-c"]
readme = "README.md"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
documentation = "http://ssheldon.github.io/rust-objc/block/"
license = "MIT"

exclude = [
  ".gitignore",
  ".travis.yml",
  "travis_install.sh",
  "travis_test.sh",
  "tests-ios/**",
]

[lib]
name = "block"

[workspace]

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
