[package]
name = "sotf-nih_plug_egui"
version = "0.0.0"
edition = "2021"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"
description = "An adapter to use egui GUIs with NIH-plug"

[lib]
name = "nih_plug_egui"

[workspace]

[features]
default = ["opengl", "default_fonts"]
opengl = ["egui-baseview/opengl"]
default_fonts = ["egui-baseview/default_fonts"]
rayon = ["egui-baseview/rayon"]

[dependencies]
nih_plug = { version = "0.0.0", package = "sotf-nih_plug", path = "../nih-plug", default-features = false }
raw-window-handle = "0.5"
baseview = { package = "sotf-baseview", version = "0.1", path = "../baseview" }
crossbeam = "0.8"
egui-baseview = { package = "sotf-egui-baseview", version = "0.5", path = "../egui-baseview" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
