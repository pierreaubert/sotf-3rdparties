[package]
name = "sotf-gpui-toolkit-sum-tree"
version = "0.1.0"
edition = "2024"
description = "A sum tree data structure, a concurrency-friendly B-tree"
license = "Apache-2.0"

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "sum_tree"
path = "src/sum_tree.rs"
doctest = false

[features]
test-support = ["proptest"]

[dependencies]
heapless = "0.9.2"
rayon = "1.8"
tracing = "0.1.40"

[dependencies.proptest]
workspace = true
features = ["attr-macro"]
optional = true

[dev-dependencies]
ctor = "1.0.6"
rand = "0.10"

[dev-dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[dev-dependencies.proptest]
workspace = true
features = ["attr-macro"]
