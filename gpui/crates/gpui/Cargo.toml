[package]
name = "sotf-gpui-toolkit-gpui"
version = "0.2.3"
edition = "2024"
description = "Zed's GPU-accelerated UI framework"
license = "Apache-2.0"
authors = ["Nathan Sobo <nathan@zed.dev>"]
homepage = "https://gpui.rs"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
readme = "README.md"

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = ["collections/test-support", "http_client/test-support", "wayland", "x11", "proptest", "dep:futures-concurrency", "dep:web-time"]
bench-support = ["profiler", "dep:criterion", "dep:bench_metrics"]
bench = ["bench-support"]
inspector = ["gpui_macros/inspector"]
leak-detection = []
font-kit = []
wayland = []
x11 = ["scap?/x11"]
screen-capture = ["scap"]
windows-manifest = ["dep:embed-resource"]
profiler = ["dep:hdrhistogram"]
stacker = ["dep:stacksafe"]

[build-dependencies.embed-resource]
version = "3.0"
optional = true

[dependencies]
anyhow = "1.0.86"
async-task = "4.7"
ctor = "1.0.6"
etagere = "0.2"
futures = "0.3.32"
inventory = "0.3.19"
itertools = "0.15.0"
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = "0.13"
profiling = "1"
rand = "0.10"
raw-window-handle = "0.6"
regex = "1.5"
ttf-parser = "0.25"
seahash = "4.1"
slotmap = "1.0.6"
taffy = "=0.14.0"
thiserror = "2.0.12"
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
url = "2.2"
heapless = "0.9.2"
async-channel = "2.5.0"

[dependencies.accesskit]
version = "0.24.0"
features = ["enumn"]

[dependencies.backtrace]
version = "0.3"
optional = true

[dependencies.bitflags]
version = "2.6.0"
features = []

[dependencies.collections]
workspace = true

[dependencies.bench_metrics]
workspace = true
optional = true

[dependencies.criterion]
version = "0.8"
features = ["html_reports"]
optional = true

[dependencies.derive_more]
package = "sotf-derive_more"
path = "../../../derive_more"
version = "2.1.1"
features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"]

[dependencies.futures-concurrency]
version = "7.7.1"
optional = true

[dependencies.gpui_macros]
workspace = true

[dependencies.gpui_shared_string]
workspace = true

[dependencies.http_client]
workspace = true

[dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"]

[dependencies.log]
version = "0.4.16"
features = ["kv_unstable_serde", "serde"]

[dependencies.proptest]
workspace = true
features = ["attr-macro"]
optional = true

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.refineable]
workspace = true

[dependencies.scheduler]
workspace = true

[dependencies.resvg]
version = "0.48.1"
default-features = false
features = ["text", "system-fonts", "memmap-fonts", "raster-images"]

[dependencies.usvg]
version = "0.48.1"
default-features = false
features = ["text"]

[dependencies.schemars]
version = "1.0"
features = ["indexmap2"]

[dependencies.serde]
version = "1.0.221"
features = ["derive", "rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[dependencies.stacksafe]
version = "1.0"
optional = true

[dependencies.strum]
version = "0.28.0"
features = ["derive"]

[dependencies.sum_tree]
workspace = true

[dependencies.gpui_util]
workspace = true

[dependencies.hdrhistogram]
version = "7"
optional = true

[dependencies.uuid]
version = "1.1.2"
features = ["v4", "v5", "v7", "serde"]

[dependencies.web-time]
version = "1.1.0"
optional = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.async-channel]
version = "2.5"
default-features = false

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies.scap]
package = "sotf-zed-scap"
version = "0.0.8-zed"
path = "../../../scap"
default-features = false
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-core-foundation]
version = "=0.3.2"
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-core-video]
version = "=0.3.2"
default-features = false
features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies.async-channel]
version = "2.5"
default-features = false
features = ["std"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = "1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.http_client]
workspace = true
features = ["test-support"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.proptest]
workspace = true
features = ["attr-macro"]

[target.'cfg(target_family = "wasm")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[target.'cfg(target_family = "wasm")'.dependencies.uuid]
version = "1.1.2"
features = ["js"]

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2.120"
web-sys = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.log]
version = "0.4.16"
features = ["kv_unstable_serde", "serde"]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-metal]
version = "0.3"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming"]

[dev-dependencies]
backtrace = "0.3"
env_logger = "0.11"
rand = "0.10"
unicode-segmentation = "1.10"

[dev-dependencies.bench_metrics]
workspace = true
features = ["test-support"]

[dev-dependencies.collections]
workspace = true
features = ["test-support"]

[dev-dependencies.futures-concurrency]
version = "7.7.1"

[dev-dependencies.web-time]
version = "1.1.0"

[dev-dependencies.gpui_util]
workspace = true

[dev-dependencies.lyon]
version = "1.0"
features = ["extra"]

[dev-dependencies.scheduler]
version = "0.1.0"
package = "sotf-gpui-toolkit-scheduler"
path = "../scheduler"
features = ["test-support"]

[dev-dependencies.util_macros]
workspace = true
