[package]
name = "sotf-gpui-toolkit-gpui-apple"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/gpui_apple.rs"
doctest = false
name = "gpui_apple"

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []
font-kit = ["dep:font-kit", "dep:core-text", "dep:objc2-core-text", "dep:pathfinder_geometry"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies.cbindgen]
version = "0.29"
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
anyhow = "1.0.86"
async-task = "4.7"
block2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.25"
etagere = "0.3"
foreign-types = "0.5"
futures = "0.3.34"
libc = "0.2"
mach2 = "0.7"
metal = "0.33"
objc2 = "0.6"
parking_lot = "0.13"
thiserror = "2.0.12"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.collections]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.core-text]
version = "22"
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.derive_more]
version = "2.1"
features = ["deref", "deref_mut", "from_str"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.dispatch2]
version = "0.3"
default-features = false
features = ["std"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.font-kit]
package = "sotf-zed-font-kit"
version = "0.14.1-zed"
path = "../../../zed-font-kit"
default-features = false
features = ["source"]
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.gpui_util]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.image]
version = "0.25.1"
default-features = false
features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-core-foundation]
version = "=0.3.2"
default-features = false
features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFBase"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-core-text]
version = "0.3.2"
default-features = false
features = ["std", "CTFont", "CTFontDescriptor"]
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-core-video]
version = "=0.3.2"
default-features = false
features = ["CVPixelBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVReturn", "objc2", "objc2-metal"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-metal]
version = "0.3"
default-features = false
features = ["MTLDevice", "MTLPixelFormat", "MTLTexture"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-foundation]
version = "=0.3.2"
default-features = false
features = ["NSThread", "NSNotification", "NSOperation", "NSProcessInfo", "block2"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-quartz-core]
version = "=0.3.2"
default-features = false
features = ["std", "CALayer", "CAMetalLayer"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-security]
version = "0.3.2"
default-features = false
features = ["std", "SecBase", "SecItem"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.pathfinder_geometry]
version = "0.5"
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies.gpui]
workspace = true
features = ["test-support"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies.objc2-core-video]
version = "=0.3.2"
default-features = false
features = ["CVBase"]

[dependencies.gpui]
workspace = true
