[package]
name = "sotf-gpui-toolkit-gpui-linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.description]
workspace = true

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "gpui_linux"
path = "src/gpui_linux.rs"

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = ["dep:accesskit_unix", "gpui_wgpu", "ashpd/wayland", "calloop-wayland-source", "wayland-backend", "wayland-client", "wayland-cursor", "wayland-protocols", "wayland-protocols-plasma", "wayland-protocols-wlr", "filedescriptor", "xkbcommon/wayland", "open", "gpui/wayland", "uuid/v5"]
x11 = ["dep:accesskit_unix", "gpui_wgpu", "ashpd", "as-raw-xcb-connection", "x11rb", "xkbcommon/x11", "xim", "filedescriptor", "open", "scap?/x11"]
screen-capture = ["gpui/screen-capture", "scap"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
anyhow = "1.0.86"
bytemuck = "1"
futures = "0.3.32"
libc = "0.2"
parking_lot = "0.13"
smol = "2.0"
url = "2.2"
calloop = "0.14.3"
notify-rust = "4"
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.accesskit]
version = "0.25"
features = ["enumn"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.accesskit_unix]
version = "0.24"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.collections]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.gpui]
workspace = true
default-features = false

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.gpui_util]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.gpui_wgpu]
workspace = true
features = ["font-kit"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.http_client]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.log]
version = "0.4.16"
features = ["kv_unstable_serde", "serde"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.strum]
version = "0.28.0"
features = ["derive"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.uuid]
version = "1.1.2"
features = ["v4", "v5", "v7", "serde"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.oo7]
package = "sotf-oo7"
path = "../../../oo7"
version = "0.7"
default-features = false
features = ["async-std", "native_crypto"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.ashpd]
version = "0.13"
default-features = false
features = ["async-io", "file_chooser", "inhibit", "notification", "open_uri", "settings", "trash"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.filedescriptor]
version = "0.8.2"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.open]
version = "5.2.0"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.xkbcommon]
version = "0.8.0"
features = ["wayland", "x11"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.scap]
package = "sotf-zed-scap"
version = "0.0.8-zed"
path = "../../../scap"
default-features = false
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.calloop-wayland-source]
version = "0.4.1"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wayland-backend]
version = "0.3.3"
features = ["client_system", "dlopen"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wayland-client]
version = "0.31.11"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wayland-cursor]
version = "0.31.11"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wayland-protocols]
version = "0.32.9"
features = ["client", "staging", "unstable"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wayland-protocols-plasma]
version = "0.3.9"
features = ["client"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.wayland-protocols-wlr]
version = "0.3.9"
features = ["client"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.as-raw-xcb-connection]
version = "1"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.x11rb]
version = "0.13.1"
features = ["allow-unsafe-code", "xkb", "randr", "xinput", "cursor", "resource_manager", "sync", "dri3"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.xim]
package = "sotf-zed-xim"
version = "0.4.0-zed"
path = "../../../xim-rs"
features = ["x11rb-xcb", "x11rb-client"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies.gpui]
workspace = true
default-features = false
features = ["test-support"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage)"]
