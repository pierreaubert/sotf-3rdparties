[package]
name = "sotf-gpui-toolkit-http-client"
version = "0.1.0"
edition = "2024"
description = "A HTTP client library for Zed and GPUI"
license = "Apache-2.0"

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "http_client"
path = "src/http_client.rs"
doctest = true

[features]
test-support = []
github-download = ["dep:async-compression", "dep:async-fs", "dep:async-tar", "dep:sha2", "dep:tempfile", "dep:util"]

[dependencies]
anyhow = "1.0.86"
bytes = "1.0"
futures = "0.3.32"
http-body = "1.0"
http = "1.1"
parking_lot = "0.12.1"
serde_urlencoded = "0.7"
url = "2.2"

[dependencies.log]
version = "0.4.16"
features = ["kv_unstable_serde", "serde"]

[dependencies.serde]
version = "1.0.221"
features = ["derive", "rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.log]
version = "0.4"
default-features = false
features = ["std"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.async-compression]
version = "0.4"
features = ["bzip2", "gzip", "futures-io"]
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.util]
workspace = true
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.async-fs]
version = "2.1"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.async-tar]
version = "0.6.1"
default-features = false
features = ["runtime-tokio", "xattr"]
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.sha2]
version = "0.11"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.tempfile]
version = "3.20.0"
optional = true
