[package]
name = "sotf-gpui-toolkit-util-macros"
version = "0.1.0"
edition = "2024"
description = "Utility macros for Zed"
license = "Apache-2.0"

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "util_macros"
path = "src/util_macros.rs"
proc-macro = true
doctest = false

[features]
perf-enabled = []

[dependencies]
quote = "1.0.9"

[dependencies.syn]
version = "3.0.4"
features = ["full", "extra-traits", "visit-mut"]

[dependencies.perf]
workspace = true

# Intentionally not inheriting [workspace.lints]: it enables the clippy
# pedantic group, which this vendored upstream code does not target.
# The zero-warnings gate (issue #6) runs default rustc/clippy lints.
[lints]
