[package]
name = "sotf-gpui-toolkit-perf"
version = "0.1.0"
edition = "2024"
description = "A tool for measuring Zed test performance, with too many Clippy lints"
license = "Apache-2.0"

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "perf"

[features]
default = ["cli"]
cli = ["dep:serde_json"]

[dependencies.collections]
workspace = true

[dependencies.serde]
version = "1.0.221"
features = ["derive", "rc"]

[dependencies.serde_json]
version = "1.0.144"
features = ["preserve_order", "raw_value"]
optional = true

[[bin]]
name = "gpui-toolkit-perf"
path = "src/main.rs"
