[package]
name = "sotf-gpui-toolkit-bench-metrics"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/bench_metrics.rs"
doctest = false
name = "bench_metrics"

[features]
test-support = []

[dependencies]
anyhow = "1.0.86"

[dependencies.criterion]
version = "0.8.2"
features = ["html_reports"]

[target.'cfg(target_os = "linux")'.dependencies.perf-event]
package = "perf-event2"
version = "0.7.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Intentionally not inheriting [workspace.lints]: it enables the clippy
# pedantic group, which this vendored upstream code does not target.
# The zero-warnings gate (issue #6) runs default rustc/clippy lints.
[lints]
