[package]
name = "sotf-gpui-toolkit-gpui-web"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[package.description]
workspace = true

[package.repository]
workspace = true

[package.readme]
workspace = true

[package.keywords]
workspace = true

[package.categories]
workspace = true

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"

[lib]
name = "gpui_web"
path = "src/gpui_web.rs"

[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[dependencies]
unicode-properties = "=0.1.4"
unicode-script = "0.5.7"
unicode-segmentation = "1.10"

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow = "1.0.86"
futures = "0.3.32"
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle = "0.6"

[target.'cfg(target_family = "wasm")'.dependencies.gpui]
workspace = true

[target.'cfg(target_family = "wasm")'.dependencies.scheduler]
workspace = true

[target.'cfg(target_family = "wasm")'.dependencies.parking_lot]
version = "0.13"
features = ["nightly"]

[target.'cfg(target_family = "wasm")'.dependencies.gpui_wgpu]
workspace = true

[target.'cfg(target_family = "wasm")'.dependencies.http_client]
workspace = true

[target.'cfg(target_family = "wasm")'.dependencies.async-channel]
version = "2.5"
default-features = false

[target.'cfg(target_family = "wasm")'.dependencies.log]
version = "0.4.16"
features = ["kv_unstable_serde", "serde"]

[target.'cfg(target_family = "wasm")'.dependencies.uuid]
version = "1.1.2"
features = ["v4", "v5", "v7", "serde"]

[target.'cfg(target_family = "wasm")'.dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[target.'cfg(target_family = "wasm")'.dependencies.wasm_thread]
version = "0.3"
features = ["es_modules"]
optional = true

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version = "0.3"
features = ["Blob", "Clipboard", "ClipboardEvent", "ClipboardItem", "CompositionEvent", "CssStyleDeclaration", "DataTransfer", "DataTransferItem", "DataTransferItemList", "Document", "DomRect", "DragEvent", "Element", "EventTarget", "File", "FileList", "FocusOptions", "Headers", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "IdleDeadline", "IdleRequestOptions", "ImageData", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList", "MediaQueryListEvent", "MessageChannel", "MessageEvent", "MessagePort", "MouseEvent", "Navigator", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "PointerEvent", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult", "Request", "RequestCredentials", "RequestInit", "RequestRedirect", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverSize", "Response", "Screen", "Storage", "TextMetrics", "VisualViewport", "WheelEvent", "Window", "console"]

[dev-dependencies]
anyhow = "1.0.86"

[dev-dependencies.gpui]
workspace = true

[dev-dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

# Intentionally not inheriting [workspace.lints]: it enables the clippy
# pedantic group, which this vendored upstream code does not target.
# The zero-warnings gate (issue #6) runs default rustc/clippy lints.
[lints]
