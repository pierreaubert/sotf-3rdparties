[package]
name = "sotf-xim-parser"
description = "XIM protocl parser"
version = "0.2.1"
authors = ["Riey <creeper844@gmail.com>"]
repository = "https://github.com/pierreaubert/sotf-3rdparties"
edition = "2018"
license = "MIT"
rust-version = "1.61"

[lib]
name = "xim_parser"

[features]
default = ["std"]
std = []
bootstrap = ["xim-gen"]

[dependencies]
bitflags = { version = "2.4.0", default-features = false }

[dev-dependencies]
xim-ctext = { package = "sotf-xim-ctext", path = "../xim-ctext", version = "0.3.0" }
pretty_assertions = "1"

[build-dependencies]
xim-gen = { package = "sotf-xim-gen", path = "../xim-gen", optional = true, version = "0.1.0" }

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
