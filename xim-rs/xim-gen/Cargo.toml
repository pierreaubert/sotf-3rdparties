[package]
name = "sotf-xim-gen"
description = "XIM protocol parser generator"
version = "0.1.0"
authors = ["Riey <creeper844@gmail.com>"]
repository = "https://github.com/pierreaubert/sotf-3rdparties"
edition = "2018"
license = "MIT"

[lib]
name = "xim_gen"

[dependencies]
convert_case = "0.6"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
