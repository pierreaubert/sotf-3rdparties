[package]
name = "sotf-nih_plug_derive"
version = "0.1.0"
edition = "2021"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"
description = "Proc macros for the NIH-plug framework"
repository = "https://github.com/pierreaubert/sotf-3rdparties"

[lib]
name = "nih_plug_derive"
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
nih_plug = { version = "0.0.0", package = "sotf-nih_plug", path = "..", default-features = false }

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
