[package]
name = "sotf-rusty-fork"
version = "0.3.1"
authors = ["Jason Lingle"]
license = "MIT/Apache-2.0"
readme = "README.md"
repository = "https://github.com/pierreaubert/sotf-3rdparties"
documentation = "https://docs.rs/sotf-rusty-fork"
keywords = ["testing", "process", "fork"]
categories = ["development-tools::testing"]
exclude = ["/gen-readme.sh", "/readme-*.md"]
edition = "2018"

description = """
Cross-platform library for running Rust tests in sub-processes using a
fork-like interface.
"""

[lib]
name = "rusty_fork"

[dependencies]
fnv = "1.0"
quick-error = "2.0.1"
tempfile = "3.0"
wait-timeout = { version = "0.2", optional = true }

[dev-dependencies]

[features]
default = [ "timeout" ]
timeout = [ "wait-timeout" ]

[package.metadata.release]
tag-name = "{{crate_name}}-v{{version}}"
